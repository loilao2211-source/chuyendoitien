name: Price API healthcheck

on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:

jobs:
  price-api-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:finance
      - run: npm run build
      - name: Check production price APIs
        env:
          PRICE_HEALTHCHECK_BASE_URL: ${{ vars.PRICE_HEALTHCHECK_BASE_URL || 'https://chuyendoitien.vercel.app' }}
        run: npm run check:price-apis
